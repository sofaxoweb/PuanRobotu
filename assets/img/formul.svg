<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" width="720" height="180" role="img" aria-label="LGS puan hesaplama akış şeması">
  <style>
    .kutu { fill: #ffffff; stroke: #16294d; stroke-width: 2; }
    .baslik { font-family: system-ui, sans-serif; font-size: 15px; font-weight: 700; fill: #16294d; }
    .alt { font-family: system-ui, sans-serif; font-size: 12px; fill: #5a6b8c; }
    .ok { stroke: #e8930c; stroke-width: 3; fill: none; marker-end: url(#okbasi); }
  </style>
  <defs>
    <marker id="okbasi" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#e8930c"/>
    </marker>
  </defs>
  <rect class="kutu" x="10" y="40" width="200" height="100" rx="12"/>
  <text class="baslik" x="110" y="80" text-anchor="middle">1. Netleri Bul</text>
  <text class="alt" x="110" y="104" text-anchor="middle">Doğru − (Yanlış ÷ 3)</text>
  <text class="alt" x="110" y="122" text-anchor="middle">3 yanlış = 1 doğru götürür</text>
  <path class="ok" d="M215,90 L255,90"/>
  <rect class="kutu" x="260" y="40" width="200" height="100" rx="12"/>
  <text class="baslik" x="360" y="80" text-anchor="middle">2. Ağırlıklandır</text>
  <text class="alt" x="360" y="104" text-anchor="middle">Net × katsayı (×4 / ×1)</text>
  <text class="alt" x="360" y="122" text-anchor="middle">Topla → en fazla 270</text>
  <path class="ok" d="M465,90 L505,90"/>
  <rect class="kutu" x="510" y="40" width="200" height="100" rx="12"/>
  <text class="baslik" x="610" y="80" text-anchor="middle">3. Puana Dönüştür</text>
  <text class="alt" x="610" y="104" text-anchor="middle">100–500 ölçeği (tahmini)</text>
  <text class="alt" x="610" y="122" text-anchor="middle">+ yüzdelik dilim tahmini</text>
</svg>
